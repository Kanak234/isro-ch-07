name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest scikit-learn astropy joblib

      - name: Run unit test suite
        run: |
          pytest -v tests/

      - name: Run pipeline demo test
        run: |
          mkdir -p /tmp/exopipe_test_out
          export MPLCONFIGDIR=/tmp/exopipe_test_out
          python exoplanet/scripts/run_pipeline.py --demo 1
